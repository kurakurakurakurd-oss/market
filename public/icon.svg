<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#292524" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Logo Group with Glow -->
  <g filter="url(#glow)">
    <!-- Central Shield / Badge -->
    <rect x="136" y="90" width="240" height="240" rx="36" fill="url(#redGrad)"/>
    
    <!-- Store / Cart Icon Inner -->
    <path d="M190 150 L322 150 L310 220 L202 220 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M175 150 L195 150 L202 220 L198 250 L315 250" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wheels -->
    <circle cx="215" cy="275" r="14" fill="#ffffff"/>
    <circle cx="295" cy="275" r="14" fill="#ffffff"/>
    
    <!-- Barcode Stripes below badge -->
    <rect x="156" y="360" width="12" height="48" rx="4" fill="#10b981"/>
    <rect x="180" y="360" width="20" height="48" rx="4" fill="#ffffff"/>
    <rect x="212" y="360" width="8" height="48" rx="4" fill="#10b981"/>
    <rect x="232" y="360" width="28" height="48" rx="4" fill="#ffffff"/>
    <rect x="272" y="360" width="14" height="48" rx="4" fill="#10b981"/>
    <rect x="298" y="360" width="22" height="48" rx="4" fill="#ffffff"/>
    <rect x="332" y="360" width="10" height="48" rx="4" fill="#10b981"/>
    <rect x="352" y="360" width="18" height="48" rx="4" fill="#ffffff"/>

    <!-- Brand Name text "PEDROS POS" -->
    <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PEDROS POS</text>
  </g>
</svg>
